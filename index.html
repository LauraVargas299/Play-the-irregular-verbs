function confetti(){const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:160},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-16-3,c:`hsl(${Math.random()*360},90%,60%)`,s:Math.random()*8+4}));let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});if(++n<130)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

async function lbGet(){

  try{return Object.entries(JSON.parse(ls.get("lb3","{}"))).map(([id,v])=>({id,...v}))}catch(e){return[]}
}
// returns "online" | "local" | "fail"
async function lbPut(){
  const v={nick:S.nick.slice(0,20),best:S.best,medal:medal(S.best),t:Date.now(),verbs:seenCount()};
  if(DB_URL){try{const r=await fetch(`${DB_URL}/scores/${pid}.json`,{method:"PUT",body:JSON.stringify(v)});return r.ok?"online":"fail"}catch(e){return "fail"}}
  try{const r=JSON.parse(ls.get("lb3","{}"));r[pid]=v;ls.set("lb3",JSON.stringify(r))}catch(e){}

}
const lbHtml=()=>rows.length?'<ol class="lb">'+rows.map((r,i)=>`<li class="${r.id===pid?"me":""}"><span>${["🥇","🥈","🥉"][i]||i+1+"."} ${esc(r.nick||"Player")}${TEACHER&&r.t?` <small>${esc(new Date(r.t).toLocaleString())}</small>`:""}</span><b>${r.best|0} pts</b></li>`).join("")+"</ol>":'<p class="mut c">No scores yet. Be the first!</p>';
async function refresh(){rows=(await lbGet()).sort((a,b)=>b.best-a.best).slice(0,TEACHER?300:10);const e=$("#lbx");if(e)e.innerHTML=lbHtml()}

// ===== RENDER =====

  if(S.screen!=="boss")clearInterval(T);
  document.body.dataset.room=S.screen==="room"?S.room:S.screen==="boss"?"boss":"home";
  ({home:rHome,room:rRoom,boss:rBoss,end:rEnd,book:rBook})[S.screen]();
  const m=$("#mute"),e=$("#es"),hp=$("#hp"),cv=$("#csv");
  if(m)m.onclick=()=>{S.mute=!S.mute;render()};

// ----- Rooms -----
function rRoom(){
  const R=ROOMS[S.room],n=Array.from({length:N},(_,i)=>i).filter(i=>S.done[S.room*N+i]).length,dark=S.room===2;
  let h=`<div class="card"><div class="hud"><span class="pill">👤 ${esc(S.nick)}</span><span class="pill">⭐ ${S.score}</span><span class="pill">🔥 x${S.streak}</span><span class="pill">🔓 ${total()}/${ROOMQ}</span></div>
  <div class="bar"><i style="width:${total()/ROOMQ*100}%"></i></div>
  <div class="map">${ROOMS.map((r,i)=>`<div class="${i<S.room||(i===S.room&&roomDone(i))?"done":i===S.room?"cur":"lock"}">${r.e} ${r.n}</div>`).join("")}</div>
  <div class="room">${R.e}</div><h2 class="c">${R.n}</h2><p class="mut c">${R.s}</p>
  <div class="how">${HOW[S.room]}</div>
  <div class="boo"><span>👻</span><div>${esc(S.boo)}</div></div>
  <div class="objs ${dark?"dark":""}" id="objs">${Array.from({length:N},(_,i)=>{const k=S.room*N+i;return `<button class="obj ${S.done[k]?"done":""}" data-k="${k}" aria-label="Lock ${i+1}">${Q[k][2]}</button>`}).join("")}${dark?'<div class="dk"></div>':""}</div>
  <p class="c mut">${n}/${N} locks open ${n<N?"· tap an object with 👆":""}</p>`;
  if(roomDone(S.room))h+=`<div class="c"><button id="next">${S.room<2?"🚪 Open the door to the next room":"🌙 Climb to the Tower!"}</button></div>`;
  h+=`${tools()}</div>`;
  if(S.q!==null)h+=ovHtml();
  $("#app").innerHTML=h;

  const ob=$("#objs");
  if(dark){const mv=e=>{const r=ob.getBoundingClientRect();ob.style.setProperty("--x",(e.clientX-r.left+14)+"px");ob.style.setProperty("--y",(e.clientY-r.top+14)+"px")};ob.addEventListener("pointermove",mv);ob.addEventListener("pointerdown",mv)}
  document.querySelectorAll(".obj").forEach(b=>b.onclick=()=>openQ(+b.dataset.k));
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b.dataset.o));
  document.querySelectorAll(".lt").forEach(b=>b.onclick=()=>{S.built.push(+b.dataset.l);const w=S.built.map(i=>S.letters[i]).join("");if(S.built.length===Q[S.q][1].length)answer(w);else{sfx(500+S.built.length*60,.08);render()}});
  const set=(id,f)=>{const e=$(id);if(e)e.onclick=f};
  set("#spk",()=>say(Q[S.q][0]+". "+Q[S.q][3].replace("___","blank")));
  set("#hint",()=>{S.hint=true;render()});
  set("#close",()=>{S.q=null;render()});
  set("#undo",()=>{S.built.pop();render()});
  set("#clr",()=>{S.built=[];render()});
  set("#sub",()=>answer($("#ti").value));
  const ti=$("#ti");if(ti)ti.onkeydown=e=>{if(e.key==="Enter")answer(ti.value)};
  set("#next",()=>{confetti();win();S.boo=pick(BOO.room);if(S.room<2){S.room++}else{startBoss();return}S.q=null;render()});
}
function scr(w){let l,n=0;do{l=shuffle(w.split(""))}while(l.join("")===w&&w.length>2&&++n<12);return l}
function openQ(k){S.q=k;S.tries=0;S.hint=false;S.wrong=[];S.fb="";S.built=[];S.letters=scr(Q[k][1]);S.opts=shuffle([Q[k][1],Q[k][4],Q[k][5]]);sfx(330,.1);render()}
function ovHtml(){
  const q=Q[S.q],ok=S.done[S.q],mode=Math.floor(S.q/N);
  let body="";
  if(mode===0){
    body=`<div class="opts">${S.opts.map(o=>`<button class="opt ${ok&&o===q[1]?"good":""} ${S.wrong.includes(o)?"bad":""}" data-o="${o}" ${ok||S.wrong.includes(o)?"disabled":""}>${o}</button>`).join("")}</div>`;
  }else if(mode===1){
    body=`<div class="slots ${ok?"good":""}">${q[1].split("").map((_,i)=>`<span class="slot">${S.built[i]!=null?S.letters[S.built[i]]:""}</span>`).join("")}</div>
    ${ok?"":`<div class="lts">${S.letters.map((c,i)=>`<button class="lt" data-l="${i}" ${S.built.includes(i)?"disabled":""}>${c}</button>`).join("")}</div><div class="row"><button class="alt" id="undo">⌫ Undo</button><button class="alt" id="clr">Clear</button></div>`}`;
  }else{
    body=ok?"":`<input id="ti" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="type the past form of “${q[0]}”"><div class="row"><button class="alt" id="spk2" onclick="say(Q[S.q][0]+'. '+Q[S.q][3].replace('___','blank'))">🎧 Listen again</button><button id="sub">Unlock 🔓</button></div>`;
  }
  return `<div class="ov"><div class="card"><div class="c"><span class="badge">${MODES[mode]}</span><p class="how" style="font-size:.9rem">${MODEHOW[mode]}</p></div><p class="big" style="font-size:3.5rem">${q[2]}</p>
  <p class="sent">${esc(q[3]).replace("___",ok?`<u>${q[1]}</u>`:"_____")}</p>
  <p class="c mut">Base verb: <b>${q[0]}</b> <button class="alt" id="spk" style="padding:3px 12px">🔊</button></p>
  ${S.es?`<p class="c mut sm">🇪🇸 ${q[6]}</p>`:""}${body}
  ${S.hint&&!ok?`<div class="msg h">💡 ${q[7]}</div>`:""}${S.fb?`<div class="msg ${ok?"g":"b"}">${S.fb}</div>`:""}${ok?`<div class="msg g">${q[0]} → <b>${q[1]}</b> ${stars(q[0])}</div>`:""}
  <div class="row">${ok?'<button id="close">Continue ➜</button>':'<button class="alt" id="hint">💡 Hint (-2 pts)</button><button class="alt" id="close">Back</button>'}</div></div></div>`;
}
function answer(val){
  const q=Q[S.q],mode=Math.floor(S.q/N);
  if(norm(val)===q[1]){
    const first=S.tries===0;
    let pts=BASEPTS[mode];if(!first)pts=Math.ceil(pts/2);if(S.hint)pts-=2;pts=Math.max(1,pts);
    S.streak=first?S.streak+1:0;S.maxStreak=Math.max(S.maxStreak,S.streak);
    if(first){S.first++;mast[q[0]]=Math.min(3,(mast[q[0]]||0)+1);ls.set("mast",JSON.stringify(mast))}
    const bonus=first&&S.streak>=3;if(bonus)pts+=2;
    S.done[S.q]=true;S.score+=pts;saveSeen(q[0]);
    S.fb=`🎉 Correct! +${pts} points${bonus?" (streak bonus 🔥)":""}`;S.boo=pick(BOO.ok);
    win();say(q[3].replace("___",q[1]));
    unlock("first");if(S.streak>=5)unlock("combo");
    if(roomDone(S.room)){setTimeout(confetti,300);if(S.mist[S.room]===0)unlock("perfect");S.boo="All 7 locks open! Open the door!"}
  }else{
    S.tries++;S.streak=0;S.wrong.push(val);S.hint=true;S.mist[S.room]++;
    if(!S.missed.includes(S.q))S.missed.push(S.q);
    S.fb="❌ Almost! Read the hint and try again.";S.boo=pick(BOO.bad);oops();
    if(mode===1)S.built=[];
  }
  render();
}

// ----- Boss -----
function startBoss(){
  const tower=Array.from({length:NV-ROOMQ},(_,i)=>ROOMQ+i);
  const missedRoom=shuffle(S.missed.filter(i=>i<ROOMQ)).slice(0,3);
  const qu=shuffle([...tower,...missedRoom]);
  S.B={queue:qu,hp:qu.length,max:qu.length,lives:LIVES,n:0,cur:0,mode:0,opts:[],limit:12000,t0:0,fb:"",locked:false,hit:false,over:null};
  S.screen="boss";S.q=null;S.streak=0;nextBossQ();
}
function nextBossQ(){
  const B=S.B;
  if(!B.queue.length)B.queue=shuffle([...Array(NV).keys()]).slice(0,3);
  B.cur=B.queue.shift();B.mode=B.n++%2;B.opts=shuffle([Q[B.cur][1],Q[B.cur][4],Q[B.cur][5]]);
  B.limit=B.mode?16000:12000;B.t0=Date.now();B.fb="";B.locked=false;B.hit=false;
  render();clearInterval(T);
  T=setInterval(()=>{const left=1-(Date.now()-B.t0)/B.limit,el=$("#tb");if(el)el.style.width=Math.max(0,left*100)+"%";if(left<=0){clearInterval(T);bossAnswer(null)}},100);
}
function rBoss(){
  const B=S.B,q=Q[B.cur];
  let h=`<div class="card c"><div class="hud"><span class="pill">${"❤️".repeat(B.lives)}${"🖤".repeat(LIVES-B.lives)}</span><span class="pill">⭐ ${S.score}</span><span class="pill">🔥 x${S.streak}</span></div>
  <div class="boss ${B.hit?"hit":""}">👹</div><h2>Lord Irregular</h2>
  <div class="bar hp"><i style="width:${B.hp/B.max*100}%"></i></div>
  <div class="bar tm"><i id="tb"></i></div>
  <p class="sent">${esc(q[3]).replace("___",B.locked?`<u>${q[1]}</u>`:"_____")}</p>
  <p class="mut">Base verb: <b>${q[0]}</b> ${S.es?`· 🇪🇸 ${q[6]}`:""}</p>
  <div class="how" style="font-size:.9rem">${B.mode===0?"👆 Tap the correct answer (or press 1, 2, 3).":"⌨️ Type the past form and press Enter or tap Attack."} Beat the timer ⏱️ or lose a ❤️!</div>`;
  if(!B.locked){
    h+=B.mode===0?`<div class="opts">${B.opts.map(o=>`<button class="bopt" data-o="${o}">${o}</button>`).join("")}</div>`
      :`<input id="ti" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="type the past form of “${q[0]}”"><div class="row"><button id="bsub">Attack ⚔️</button></div>`;
  }
  if(B.fb)h+=`<div class="msg ${B.hit?"g":"b"}">${B.fb}</div>`;
  h+=`${tools(false)}</div>`;
  if(B.over==="win")h+=`<div class="ov"><div class="card c"><p class="big">💥</p><h1>Lord Irregular vanishes!</h1><p class="mut">The front door swings open...</p></div></div>`;
  if(B.over==="lose")h+=`<div class="ov"><div class="card c"><p class="big">😵</p><h2>The ghost caught you!</h2><p class="mut">Don't worry. He will ask the verbs again.</p><div class="row"><button id="retry">Try again 🔦</button></div></div></div>`;
  $("#app").innerHTML=h;
  document.querySelectorAll(".bopt").forEach(b=>b.onclick=()=>bossAnswer(b.dataset.o));
  const ti=$("#ti"),bs=$("#bsub");if(ti)ti.onkeydown=e=>{if(e.key==="Enter")bossAnswer(ti.value)};if(bs)bs.onclick=()=>bossAnswer(ti.value);
  const rt=$("#retry");if(rt)rt.onclick=startBoss;
  const tb=$("#tb");if(tb&&!B.locked)tb.style.width=Math.max(0,(1-(Date.now()-B.t0)/B.limit)*100)+"%";
}
function bossAnswer(v){
  const B=S.B;if(!B||B.locked||B.over)return;
  const q=Q[B.cur],el=Date.now()-B.t0;clearInterval(T);B.locked=true;
  if(v!==null&&norm(v)===q[1]){
    let pts=10+(el<3000?5:el<6000?2:0);S.streak++;S.maxStreak=Math.max(S.maxStreak,S.streak);if(S.streak>=3)pts+=2;
    S.score+=pts;B.hp--;B.hit=true;saveSeen(q[0]);
    B.fb=`💥 Direct hit! +${pts}${el<3000?" ⚡ Lightning!":""}`;sfx(90,.25,"square",.2);win();say(q[3].replace("___",q[1]));
    if(el<3000)unlock("speed");if(S.streak>=5)unlock("combo");
    if(B.hp<=0){B.over="win";render();confetti();setTimeout(finish,2000);return}
    render();setTimeout(nextBossQ,1100);
  }else{
    S.streak=0;B.lives--;B.fb=v===null?`⏰ Too slow! It was “${q[1]}”`:`❌ Ouch! It was “${q[1]}”`;
    if(!S.missed.includes(B.cur))S.missed.push(B.cur);B.queue.push(B.cur);oops();
    if(B.lives<=0){B.over="lose";render();return}
    render();setTimeout(nextBossQ,1800);
  }
}
function finish(){
  if(S.B.lives===LIVES)unlock("flawless");unlock("escape");
  S.stamp=Date.now();S.sent=null;
  if(S.score>S.best){S.best=S.score;ls.set("best3",S.best)}
  S.screen="end";win();render();
  lbPut().then(r=>{S.sent=r;refresh().then(()=>{if(S.screen==="end")render()})});
}

// ===== EVENTS & ATMOSPHERE =====
document.addEventListener("keydown",e=>{
  if(S.help){if(e.key==="Escape"){S.help=false;ls.set("seenHelp","1");render()}return}
  if(e.target.tagName==="INPUT")return;
  if(e.key==="Escape"&&S.screen==="room"&&S.q!==null&&!S.done[S.q]){S.q=null;render();return}
  if("123".includes(e.key)&&e.key){
    const i=+e.key-1;
    if(S.screen==="room"&&S.q!==null&&!S.done[S.q]&&Math.floor(S.q/N)===0&&S.opts[i])answer(S.opts[i]);
    else if(S.screen==="boss"&&S.B&&!S.B.locked&&!S.B.over&&S.B.mode===0&&S.B.opts[i])bossAnswer(S.B.opts[i]);
  }
});
for(let i=0;i<10;i++){const s=document.createElement("span");s.textContent=["👻","🦇","🕸️","🕯️"][i%4];s.style.cssText=`left:${i*10+Math.random()*8}%;font-size:${30+Math.random()*40}px;animation-duration:${14+Math.random()*16}s;animation-delay:-${Math.random()*20}s`;$("#bg").appendChild(s)}
// soft, silent lightning glow (never during the timed boss fight)
(function storm(){setTimeout(()=>{if(S.screen!=="boss"){const f=$("#fl");f.classList.remove("on");void f.offsetWidth;f.classList.add("on")}storm()},15000+Math.random()*20000)})();
render();refresh();setInterval(refresh,6000);
</script>
</body>
</html>
